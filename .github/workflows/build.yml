name: Build document

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    name: Typst formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Typst formatting
        run: make format-check

  prose:
    name: English prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check English spelling and grammar
        run: make prose-check

  build:
    name: PDF build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build PDF
        run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: document-preview
          path: build/ARFV-Notes_*.pdf
          if-no-files-found: error
