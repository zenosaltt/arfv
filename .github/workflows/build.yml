name: Build document

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  format:
    name: Typst formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Prepare Docker tools image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: arfv-tools:0.15.1
          cache-from: type=gha,scope=arfv-tools
      - name: Check Typst formatting
        run: make --assume-old=docker-image format-check

  prose:
    name: English prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Prepare Docker tools image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: arfv-tools:0.15.1
          cache-from: type=gha,scope=arfv-tools
      - name: Check English spelling and grammar
        run: make --assume-old=docker-image prose-check

  build:
    name: PDF build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Prepare and cache Docker tools image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: arfv-tools:0.15.1
          cache-from: type=gha,scope=arfv-tools
          cache-to: type=gha,scope=arfv-tools,mode=max,ignore-error=true
      - name: Build PDF
        run: make --assume-old=docker-image build
      - uses: actions/upload-artifact@v7
        with:
          name: document-preview
          path: build/ARFV-Notes_*.pdf
          if-no-files-found: error
