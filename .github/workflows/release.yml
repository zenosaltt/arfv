name: Release document

on:
  push:
    tags: ['**']

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Prepare Docker tools image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: arfv-tools:0.15.1
          cache-from: type=gha,scope=arfv-tools
      - name: Check Typst formatting
        run: make --assume-old=docker-image format-check
      - name: Check English spelling and grammar
        run: make --assume-old=docker-image prose-check
      - name: Build tagged PDF with Docker
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make --assume-old=docker-image build
      - name: Publish GitHub Release with PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/ARFV-Notes_*.pdf --verify-tag --generate-notes
