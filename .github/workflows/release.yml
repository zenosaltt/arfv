name: Release document

on:
  push:
    tags: ['**']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Typst formatting
        run: make format-check
      - name: Check English spelling and grammar
        run: make prose-check
      - name: Build tagged PDF with Docker
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make build
      - name: Publish GitHub Release with PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/ARFV-Notes_*.pdf --verify-tag --generate-notes
